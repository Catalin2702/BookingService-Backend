[package]
name = "booking_service"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = {
    version = "0.8",
    features = [
        "http2",
        "macros",
        "ws",
    ]
}

log = {
    version = "0.4",
    features = [
        "max_level_debug",
        "release_max_level_warn"
    ]
}

sea-orm = {
    version = "2.0",
    features = [
        "sqlx-postgres",
        "runtime-tokio",
        "macros"
    ]
}

tokio = {
    version = "1.53",
    features = [
        "macros",
        "rt-multi-thread",
        "net"
    ]
}

serde = {
    version = "1.0",
    features = [
        "derive"
    ]
}

serde_json = "1.0"
