[package]
name = "booking-service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
sea-orm = {
    version = "2.0",
    features = [
        "sqlx-postgres",
        "runtime-tokio",
        "macros"
    ]
}
tokio = {
    version = "1.53",
    features = [
        "macros",
        "rt-multi-thread",
        "net"
    ]
}
serde = {
    version = "1.0",
    features = [
        "derive"
    ]
}
serde_json = "1.0"
