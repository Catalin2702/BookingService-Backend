name: booking-service

services:
    database:
        image: postgres:18.6-alpine3.24
        container_name: database
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: "${POSTGRES_USER}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
            POSTGRES_DB: "${POSTGRES_DB}"
        volumes:
            - pg_data:/var/lib/postgresql

volumes:
    pg_data:
        name: database_data
